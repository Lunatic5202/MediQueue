name: Dependency remediation preview

on:
  push:
    branches:
      - "security/**"
    paths:
      - "frontend/package.json"
      - ".github/workflows/dependency-remediation-preview.yml"

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Preview and validate compatible toolchain updates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Update Vite and Vitest within selected release lines
        run: npm install --save-dev vite@^6.4.5 vitest@^5.0.5 --package-lock-only --ignore-scripts

      - name: Install from generated lockfile
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Run ESLint
        run: npm run lint

      - name: Generate post-update audit report
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-after.json
          audit_status=$?
          set -e
          echo "npm audit exit status: $audit_status"
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit-after.json", "utf8"));
          console.log("Post-update vulnerability counts:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const item of Object.values(report.vulnerabilities ?? {})) {
            console.log(`- ${item.name}: ${item.severity}; direct=${item.isDirect}; range=${item.range}`);
          }
          NODE

      - name: Commit validated dependency lockfile to remediation branch
        if: success() && github.ref == 'refs/heads/security/mediqueue-toolchain-remediation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: lock patched Vite and Vitest versions"
            gh auth setup-git
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No dependency manifest or lockfile changes to commit."
          fi

      - name: Upload candidate manifests, lockfile and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediqueue-dependency-remediation-candidate
          path: |
            frontend/package.json
            frontend/package-lock.json
            frontend/npm-audit-after.json
          if-no-files-found: warn
          retention-days: 14
