[alembic]
script_location = backend/migrations
prepend_sys_path = backend
# URL comes from MEDIQUEUE_DATABASE_URL (see backend/migrations/env.py)

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
